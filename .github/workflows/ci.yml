name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  clojure:
    name: clj-kondo + Lazytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Cache the dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-
      - name: Lint
        run: clojure -M -m clj-kondo.main --lint src test
      - name: Run the tests
        run: clojure -M:test

  extension:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the declared dependencies
        run: uv sync
      - name: Check formatting
        run: uv run --with ruff ruff format --check .
      - name: Lint
        run: uv run --with ruff ruff check .
      - name: Run the tests
        run: uv run --with pytest pytest tests -q

  versions:
    name: One version everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that every version source agrees
        run: |
          set -euo pipefail
          declared=$(tr -d '[:space:]' < VERSION)
          package=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('extension/pyproject.toml').read_text())['project']['version'])")
          library=$(python3 -c "import re,pathlib;print(re.search('LIBRARY_VERSION = \"([^\"]+)\"', pathlib.Path('extension/src/vis_lang_clojure/bridge.py').read_text()).group(1))")
          registered=$(python3 -c "import re,pathlib;print(re.search('version=\"([^\"]+)\"', pathlib.Path('extension/extension.py').read_text()).group(1))")
          for found in "$package" "$library" "$registered"; do
            if [ "$found" != "$declared" ]; then
              echo "VERSION $declared disagrees with package $package, bridge $library, extension $registered." >&2
              exit 1
            fi
          done
          echo "Every version source says $declared."
