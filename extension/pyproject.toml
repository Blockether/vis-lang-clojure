[project]
name = "vis-lang-clojure"
version = "1.0.0"
description = "Clojure tools for Vis: zprint and cljfmt formatting, clj-kondo lint, test runs and an nREPL."
requires-python = ">=3.11"
dependencies = [
  "vis-agent>=0.2.10",
  "vis-lang-interface @ git+https://github.com/Blockether/vis-lang-interface@v1.0.0",
]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
# The README aligns its examples for people to read; ruff must not reflow them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned so a new ruff default set cannot change the verdict of a release.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# TestResult from the contract is data, not a test case: collect functions only.
python_classes = []
